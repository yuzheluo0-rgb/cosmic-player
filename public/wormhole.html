<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>时空虫洞 — TIME WORMHOLE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Microsoft YaHei','Orbitron',sans-serif;color:#c0d8f0;overflow-x:hidden}
canvas{position:fixed;top:0;left:0;z-index:0;transition:opacity 1.5s}
#tunnelView{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,transform .8s}
#tunnelView.hide{opacity:0;transform:scale(1.3);pointer-events:none}
#title{font-size:2.2rem;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#80c8f0,#6633cc,#80c8f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;text-align:center}
#subtitle{font-size:.7rem;color:#448;letter-spacing:4px;margin-bottom:30px}
#yearDisplay{font-size:5rem;font-weight:900;color:#c0d8f0;text-shadow:0 0 40px rgba(120,180,240,0.6),0 0 80px rgba(80,120,220,0.3);letter-spacing:8px;margin:10px 0;transition:all .5s}
#yearNav{display:flex;align-items:center;gap:20px;margin:10px 0}
.nav-btn{width:50px;height:50px;border-radius:50%;border:1px solid rgba(120,180,220,0.3);background:rgba(5,15,30,0.5);color:#80b8d8;font-size:1.2rem;cursor:pointer;transition:all .3s;backdrop-filter:blur(4px)}
.nav-btn:hover{border-color:rgba(140,200,240,0.6);box-shadow:0 0 20px rgba(100,160,220,0.3);color:#c0e0f0}
#warpBtn{padding:14px 40px;border-radius:28px;border:1px solid rgba(140,100,240,0.4);background:linear-gradient(135deg,rgba(60,20,120,0.5),rgba(20,10,60,0.5));color:#c0a0f0;font-family:'Orbitron';font-size:1rem;letter-spacing:3px;cursor:pointer;transition:all .4s;margin-top:16px;backdrop-filter:blur(4px)}
#warpBtn:hover{background:linear-gradient(135deg,rgba(100,40,180,0.6),rgba(40,20,100,0.6));border-color:rgba(160,120,255,0.7);box-shadow:0 0 35px rgba(140,100,240,0.4),0 0 70px rgba(100,60,200,0.2);color:#d0c0ff}
.year-input{width:120px;padding:8px 16px;background:rgba(5,15,30,0.6);border:1px solid rgba(120,180,220,0.15);border-radius:20px;color:#c0d8f0;font-family:'Orbitron';font-size:1rem;text-align:center;letter-spacing:2px;outline:none}.year-input:focus{border-color:rgba(140,200,240,0.4)}
#flash{position:fixed;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
#flash.fire{opacity:0.9;transition:opacity 0s}
#closeBtn{position:fixed;top:20px;right:20px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid rgba(120,180,220,0.2);background:rgba(5,15,30,0.5);color:#889;cursor:pointer;font-size:1rem;transition:all .3s;line-height:40px;text-align:center;text-decoration:none}#closeBtn:hover{border-color:rgba(120,180,220,0.5);color:#c0d8f0}
#loading{display:none;position:fixed;inset:0;z-index:6;background:rgba(0,0,0,0.6);align-items:center;justify-content:center}#loading.show{display:flex}.wormhole-loader{width:60px;height:60px;border:2px solid rgba(120,180,240,0.15);border-top-color:rgba(140,100,240,0.7);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* === RESULTS - BIG FULL-WIDTH LAYOUT === */
#resultsView{position:fixed;z-index:2;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:30px;scrollbar-width:thin;scrollbar-color:rgba(120,180,220,0.1) transparent;background:radial-gradient(ellipse at center,rgba(8,20,50,0.6),rgba(0,0,0,0.96))}
#resultsView.show{display:flex;animation:fadeIn 1s ease-out}
#resultsView::-webkit-scrollbar{width:3px}#resultsView::-webkit-scrollbar-thumb{background:rgba(120,180,220,0.1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.res-year{font-size:3.5rem;font-weight:900;text-align:center;color:#80b8d8;text-shadow:0 0 40px rgba(120,180,240,0.5),0 0 80px rgba(80,160,220,0.2);letter-spacing:8px;margin-bottom:24px}
.res-content{max-width:860px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px;min-height:75vh}
.res-card{background:rgba(8,18,36,0.75);border:1px solid rgba(120,180,220,0.12);border-radius:18px;overflow:hidden;transition:all .3s}.res-card:hover{border-color:rgba(120,180,220,0.22)}
.res-card-inner{display:flex;gap:0;min-height:240px}
.res-cover{width:220px;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.res-cover img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.res-cover .cover-fallback{position:relative;z-index:1;text-align:center;padding:24px}
.res-cover .cf-icon{font-size:2.8rem;opacity:.35;margin-bottom:10px}
.res-cover .cf-title{font-size:1.1rem;color:#c0d0e0;font-weight:700;line-height:1.3}
.res-cover .cf-sub{font-size:.7rem;color:#778;margin-top:6px}
.res-cover.movie{background:linear-gradient(160deg,#1a0d1a,#0d1020)}.res-cover.book{background:linear-gradient(160deg,#0d1a16,#0d1020)}.res-cover.event{background:linear-gradient(160deg,#1a1408,#0d1020)}
.res-detail{flex:1;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.res-detail .rd-label{font-size:.62rem;color:#556;letter-spacing:3px;margin-bottom:6px;text-transform:uppercase}
.res-detail .rd-title{font-size:1.25rem;color:#d0dce8;font-weight:700;margin-bottom:6px;line-height:1.3}
.res-detail .rd-sub{font-size:.78rem;color:#889;margin-bottom:10px}
.res-detail .rd-desc{font-size:.82rem;color:#a0b0c0;line-height:1.8}
#backBtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 28px;border-radius:24px;border:1px solid rgba(120,180,220,0.25);background:rgba(10,20,40,0.5);color:#90a8c0;cursor:pointer;font-family:'Orbitron';font-size:.8rem;letter-spacing:3px;margin:24px auto;transition:all .3s}#backBtn:hover{border-color:rgba(140,200,240,0.5);color:#c0dce8;box-shadow:0 0 30px rgba(100,160,220,0.2)}
@media(max-width:768px){.res-card-inner{flex-direction:column}.res-cover{width:100%;height:180px}#resultsView{padding:16px}.res-detail{padding:16px 18px}.res-year{font-size:2rem;margin-bottom:16px}.res-detail .rd-title{font-size:1.05rem}.res-detail .rd-desc{font-size:.74rem}#title{font-size:1.2rem}#yearDisplay{font-size:3rem}.nav-btn{width:38px;height:38px}}
</style>
</head>
<body>
<canvas id="tunnel"></canvas>
<div id="flash"></div>
<div id="loading"><div class="wormhole-loader"></div></div>
<a href="/" id="closeBtn">✕</a>
<div id="tunnelView">
  <div id="title">时 空 虫 洞</div>
  <div id="subtitle">T I M E &nbsp; W O R M H O L E</div>
  <div id="yearDisplay">2025</div>
  <div id="yearNav">
    <button class="nav-btn" onclick="changeYear(-1)">◀</button>
    <input type="number" class="year-input" id="yearInput" value="2025" min="1926" max="2025" onchange="setYear(this.value)" onkeydown="if(event.key==='Enter')warp()">
    <button class="nav-btn" onclick="changeYear(1)">▶</button>
  </div>
  <button id="warpBtn" onclick="warp()">启 动 虫 洞</button>
</div>
<div id="resultsView"></div>

<!-- Business logic (runs immediately, no CDN dependency) -->
<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var curYear=2025;
window.changeYear=function(d){curYear=Math.max(1926,Math.min(2025,curYear+d));document.getElementById('yearDisplay').textContent=curYear;document.getElementById('yearInput').value=curYear};
window.setYear=function(v){var y=parseInt(v);if(y>=1926&&y<=2025){curYear=y;document.getElementById('yearDisplay').textContent=y;document.getElementById('yearInput').value=y}};
window.goBack=function(){document.getElementById('resultsView').classList.remove('show');document.getElementById('tunnelView').classList.remove('hide');setTimeout(function(){document.getElementById('resultsView').innerHTML=''},500)};
function showResults(d){
  var el=document.getElementById('resultsView'),h='<div class="res-year">'+esc(d.year)+'</div><div class="res-content">';
  if(d.movie){var poster=d.movie.poster?'<img src="'+esc(d.movie.poster)+'" onerror="this.style.display=\'none\'" alt="">':'',fb='<div class="cover-fallback"><div class="cf-icon">🎬</div><div class="cf-title">'+esc(d.movie.title)+'</div><div class="cf-sub">'+esc(d.movie.dir)+'</div></div>';h+='<div class="res-card"><div class="res-card-inner"><div class="res-cover movie">'+poster+fb+'</div><div class="res-detail"><div class="rd-label">🎬 那年电影</div><div class="rd-title">'+esc(d.movie.title)+'</div><div class="rd-sub">导演：'+esc(d.movie.dir)+'</div><div class="rd-desc">'+esc(d.movie.desc)+'</div></div></div></div>'}
  if(d.book){var fb2='<div class="cover-fallback"><div class="cf-icon">📖</div><div class="cf-title">'+esc(d.book.title)+'</div><div class="cf-sub">'+esc(d.book.author)+'</div></div>',cover2=d.book.cover?'<img src="'+esc(d.book.cover)+'" onerror="this.style.display=\'none\'" alt="">':'';h+='<div class="res-card"><div class="res-card-inner"><div class="res-cover book">'+cover2+fb2+'</div><div class="res-detail"><div class="rd-label">📖 那年书籍</div><div class="rd-title">'+esc(d.book.title)+'</div><div class="rd-sub">'+esc(d.book.author)+'</div><div class="rd-desc">'+esc(d.book.desc)+'</div></div></div></div>'}
  if(d.event){h+='<div class="res-card"><div class="res-card-inner"><div class="res-cover event"><div class="cover-fallback"><div class="cf-icon">📜</div><div class="cf-title">历史大事</div><div class="cf-sub">'+esc(d.year)+'年</div></div></div><div class="res-detail"><div class="rd-label">📜 那年发生的事</div><div class="rd-title">'+esc(d.year)+'年</div><div class="rd-desc">'+esc(d.event)+'</div></div></div></div>'}
  h+='<button id="backBtn" onclick="goBack()">🌀 再次穿越</button></div>';
  el.innerHTML=h;el.classList.add('show')}
window.warp=async function(){
  document.getElementById('loading').classList.add('show');
  document.getElementById('yearDisplay').style.textShadow='0 0 60px rgba(180,140,240,0.8)';
  try{
    var r=await fetch('/api/wormhole/'+curYear),d=await r.json();
    document.getElementById('loading').classList.remove('show');
    document.getElementById('tunnelView').classList.add('hide');
    document.getElementById('yearDisplay').style.textShadow='';
    if(window._setWarp)window._setWarp(0.5);
    setTimeout(function(){if(window._setWarp)window._setWarp(0.015)},2000);
    showResults(d);
  }catch(e){
    document.getElementById('loading').classList.remove('show');
    document.getElementById('resultsView').innerHTML='<div style=\"color:#f55;text-align:center;padding:60px\">虫洞穿越失败: '+e.message+'</div>';
    document.getElementById('resultsView').classList.add('show');
  }};
</script>

<!-- Three.js tunnel (runs when CDN loads, exposes _setWarp for warp control) -->
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('tunnel'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,60);
camera.position.set(0,0,6);camera.lookAt(0,0,-10);
var tc=3000,tGeo=new THREE.BufferGeometry(),tPos=new Float32Array(tc*3),tCol=new Float32Array(tc*3),tps=[];
for(var i=0;i<tc;i++){var a=Math.random()*Math.PI*2,r=1.5+Math.random()*5,z=(Math.random()-.3)*12-3;tPos[i*3]=Math.cos(a)*r;tPos[i*3+1]=Math.sin(a)*r;tPos[i*3+2]=z;var cc=new THREE.Color().setHSL(0.6+Math.random()*0.2,0.7,0.15+Math.random()*0.5);tCol[i*3]=cc.r;tCol[i*3+1]=cc.g;tCol[i*3+2]=cc.b;tps.push({br:r,ba:a,sp:.01+Math.random()*.04,z:z})}
tGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3));tGeo.setAttribute('color',new THREE.BufferAttribute(tCol,3));
var tunnel=new THREE.Points(tGeo,new THREE.PointsMaterial({size:.04,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.7}));scene.add(tunnel);
var gm=new THREE.ShaderMaterial({uniforms:{time:{value:0}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:'varying vec3 vPos;void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying vec3 vPos;uniform float time;void main(){float d=length(vPos);float g=exp(-d*2.5)*.6;gl_FragColor=vec4(vec3(.5+.5*sin(time),.6+.4*cos(time*.7),1.),g);}'});
var glow=new THREE.Mesh(new THREE.SphereGeometry(.6,32,32),gm);scene.add(glow);
var ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,.02,16,80),new THREE.MeshBasicMaterial({color:0x6688cc,transparent:true,opacity:.4,depthWrite:false}));ring.rotation.x=Math.PI/2.7;scene.add(ring);
var ring2=new THREE.Mesh(new THREE.TorusGeometry(1.8,.015,16,100),new THREE.MeshBasicMaterial({color:0x8866cc,transparent:true,opacity:.25,depthWrite:false}));ring2.rotation.x=Math.PI/2.2;ring2.rotation.y=.3;scene.add(ring2);
var ws=.015,tw=.015;
window._setWarp=function(v){tw=v};
function anim(){requestAnimationFrame(anim);ws+=(tw-ws)*.05;gm.uniforms.time.value+=.02;ring.rotation.z+=.003;ring2.rotation.z-=.002;var p=tGeo.attributes.position.array;for(var i=0;i<tc;i++){var idx=i*3,tp=tps[i];tp.z-=ws;if(tp.z<-6){tp.z=10;tp.br=1.5+Math.random()*5;tp.ba=Math.random()*Math.PI*2}var rr=tp.br*(1+tp.z*.08),aa=tp.ba+tp.z*.04;p[idx]=Math.cos(aa)*rr;p[idx+1]=Math.sin(aa)*rr;p[idx+2]=tp.z}tGeo.attributes.position.needsUpdate=true;renderer.render(scene,camera)}anim();
window.addEventListener('resize',function(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script>
</body>
</html>
